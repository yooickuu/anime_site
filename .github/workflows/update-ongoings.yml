name: Auto-update Ongoing Anime
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    defaults:
      run:
        working-directory: yoru
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '26.10.0'
          cache: npm
          cache-dependency-path: yoru/package-lock.json
      - run: npm ci
      - name: Refresh released episodes
        env:
          KODIK_API_TOKEN: ${{ secrets.KODIK_API_TOKEN || secrets.KODIK_TOKEN }}
        run: npm run update:ongoings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ongoing-update-report
          path: yoru/checks/ongoing-update.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate and build
        run: npm test && npm run build
      - name: Commit complete publication
        id: commit
        run: |
          if ! git diff --quiet -- src/published-catalog.json.gz src/ongoing-retries.json; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add src/ongoing-retries.json src/catalog-bootstrap.json ../data/catalog/ src/published-catalog.json.gz src/runtime-catalog.json dist/ ../app.js ../index.html ../catalog-build.json ../style.css ../redesign.css ../scenes.css ../liquid.css ../social/ ../providers/ ../activity/ ../together/ ../data/kodik/ ../data/media/
            git commit -m "Update ongoing episodes and publication"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      # A push by GITHUB_TOKEN does not trigger pages.yml. Deploy this artifact explicitly.
      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.commit.outputs.changed == 'true'
        with:
          path: yoru/dist
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish updated episodes
        id: deployment
        uses: actions/deploy-pages@v4
